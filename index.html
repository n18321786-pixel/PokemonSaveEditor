<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Save Editor</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Pokémon Save Editor</h1>

    <button id="languageBtn">🌐 English</button>
    <button id="themeBtn">🌙 Dark Mode</button>
</header>

<main>

    <input type="file" id="saveFile" accept=".sav">

    <br><br>

    <button id="openBtn">Open Save</button>

    <div id="info">
        No save loaded.
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
